<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
    <title>52Note</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #5f6368;
            background: #fff;
            font-family: "Segoe UI", "Microsoft Yahei", sans-serif;
        }

        .boot {
            display: flex;
            width: min(320px, 70vw);
            flex-direction: column;
            align-items: center;
        }

        .boot__logo {
            width: 112px;
            height: 112px;
            object-fit: contain;
        }

        .boot__name {
            margin-top: 14px;
            color: #202124;
            font-size: 22px;
            font-weight: 600;
        }

        .boot__progress-track {
            width: 100%;
            height: 3px;
            margin-top: 28px;
            overflow: hidden;
            border-radius: 2px;
            background: #edf0f5;
        }

        .boot__progress {
            width: 0;
            height: 100%;
            background: #4285f4;
        }

        .boot__details {
            width: 100%;
            margin-top: 10px;
            overflow: hidden;
            color: #80868b;
            font-size: 12px;
            text-align: center;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
    </style>
</head>
<body>
<main class="boot">
    <img class="boot__logo" src="icon.png" alt="52Note">
    <div class="boot__name">52Note</div>
    <div class="boot__progress-track"><div id="progress" class="boot__progress"></div></div>
    <div id="details" class="boot__details"></div>
</main>
<script>
    const getSearch = (key) => {
        const params = new URLSearchParams(window.location.search);
        return params.get(key) || "";
    };

    (() => {
        const version = getSearch("v");
        const port = getSearch("port") || "6806";
        const progressElement = document.getElementById("progress");
        const detailsElement = document.getElementById("details");
        detailsElement.textContent = `52Note v${version}`;
        let completed = false;

        const subscribe = () => {
            const source = new EventSource(`http://127.0.0.1:${port}/api/system/bootProgressSSE`);
            source.onmessage = (event) => {
                const progressData = JSON.parse(event.data);
                progressElement.style.width = `${Math.max(0, Math.min(100, progressData.progress))}%`;
                detailsElement.textContent = progressData.details || `52Note v${version}`;
                if (progressData.progress >= 100) {
                    completed = true;
                    source.close();
                }
            };
            source.onerror = () => {
                source.close();
                if (!completed) {
                    setTimeout(subscribe, 100);
                }
            };
        };

        subscribe();
    })();
</script>
</body>
</html>
